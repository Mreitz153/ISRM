name: Sync canonical ISRM v1.0 PDFs

on:
  push:
    paths:
      - '.github/workflows/sync-zenodo-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical v1.0 PDFs from Zenodo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/publications
          base="https://zenodo.org/records/23115842/files"
          files=(
            "01_ISRM_v1.0_Public_Specification.pdf"
            "02_ISRM_Whitepaper.pdf"
            "03_ISRM_Validation_and_Falsification_Report.pdf"
            "04_ISRM_Prior_Art_and_Standards_Crosswalk.pdf"
            "10_ISRM_Reference_Implementation_Validation_Report.pdf"
            "16_ISRM_Final_Internal_Validation_Addendum.pdf"
          )
          for f in "${files[@]}"; do
            curl --fail --location --retry 3 "$base/$f?download=1" -o "docs/publications/$f"
            test -s "docs/publications/$f"
            file "docs/publications/$f" | grep -q PDF
          done
      - name: Commit PDFs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/publications/*.pdf
          if git diff --cached --quiet; then
            echo "Canonical PDFs already present."
          else
            git commit -m "Add canonical ISRM v1.0 PDFs from Zenodo"
            git push
          fi
